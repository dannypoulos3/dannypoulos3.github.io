<style>
  :root{
    --bg:#0E141B; --surface:#18212C; --surface2:#1F2A37;
    --border:#2A3744; --borderSoft:#222E3B;
    --text:#EAF1F7; --sub:#8597A6; --faint:#566472;
    --accent:#FF6B3D; --accentDim:rgba(255,107,61,.13);
    --fresh:#3FC183; --warm:#F2B53C; --stale:#EE5247;
    --cond:'Barlow Condensed', system-ui, sans-serif;
    --body:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 60% at 50% -10%, #16202C 0%, var(--bg) 55%);
    background-attachment:fixed;
    color:var(--text); font-family:var(--body);
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::placeholder{color:var(--faint);}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7);}

  header{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    background:rgba(14,20,27,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--borderSoft);
  }
  .brand{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:1.5px;line-height:1;}
  .brand span{color:var(--accent);}
  .byline{font-size:11px;color:var(--faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
  .byline b{color:var(--accent);font-weight:600;letter-spacing:2px;}
  .tagline{color:var(--sub);font-size:12.5px;margin-top:3px;}
  .icon-btn{background:none;border:none;padding:8px;cursor:pointer;border-radius:10px;display:grid;place-items:center;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px 4px;}
  .legend .item{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:99px;}
  .legend .t{font-size:11.5px;color:var(--sub);}

  main{padding:10px 14px 30px;display:flex;flex-direction:column;gap:16px;max-width:620px;margin:0 auto;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
  .card-top{display:flex;gap:12px;padding:16px 16px 12px;align-items:flex-start;}
  .card-title{font-family:var(--cond);font-weight:700;font-size:26px;margin:0;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:9px;}
  .up-next{font-family:var(--body);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);background:var(--accentDim);padding:3px 8px;border-radius:99px;}
  .name-input{font-family:var(--cond);font-weight:700;font-size:26px;background:var(--surface2);border:1px solid var(--accent);border-radius:8px;color:var(--text);padding:2px 8px;width:100%;outline:none;}
  .last-done{margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;padding:4px 0;}
  .date-row{margin-top:6px;display:flex;align-items:center;gap:8px;}
  .date-input{background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px 10px;font-size:14px;outline:none;}
  .clear-btn{background:none;border:1px solid var(--border);border-radius:9px;color:var(--sub);padding:8px 12px;font-size:13px;cursor:pointer;}
  .done-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#1a0d06;border:none;border-radius:11px;padding:9px 13px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .undo-btn{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--sub);border:1px solid var(--border);border-radius:11px;padding:9px 13px;font-weight:600;font-size:13.5px;cursor:pointer;}

  .overdue{display:flex;align-items:center;gap:7px;margin:0 16px 4px;padding:8px 11px;background:rgba(238,82,71,.1);border:1px solid rgba(238,82,71,.27);border-radius:10px;color:var(--stale);font-size:12.5px;font-weight:500;}

  .ex-list{padding:6px 8px 4px;}
  .ex-row{padding:10px 8px;border-top:1px solid var(--borderSoft);}
  .ex-head{display:flex;align-items:center;gap:8px;width:100%;}
  .ex-name-btn{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;padding:2px 0;color:var(--text);}
  .ex-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-meta{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-meta .note{color:var(--faint);}
  .expand-btn{flex-shrink:0;background:none;border:none;cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px;}

  .stepper{display:flex;align-items:stretch;flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;height:48px;}
  .step-btn{width:42px;background:none;border:none;color:var(--text);cursor:pointer;display:grid;place-items:center;}
  .step-btn.accent{background:var(--accentDim);color:var(--accent);}
  .step-value{min-width:64px;background:none;border:none;border-left:1px solid var(--borderSoft);border-right:1px solid var(--borderSoft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;line-height:1;}
  .step-num{font-family:var(--cond);font-weight:700;font-size:21px;transition:color .3s;}
  .step-unit{font-size:9.5px;color:var(--sub);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
  .step-input{width:86px;background:none;border:none;border-left:1px solid var(--borderSoft);border-right:1px solid var(--borderSoft);color:var(--text);text-align:center;font-family:var(--cond);font-weight:700;font-size:18px;outline:none;}

  .bar-track{height:6px;background:#0c1117;border-radius:99px;margin-top:10px;overflow:hidden;border:1px solid var(--borderSoft);}
  .bar{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1), box-shadow .4s;}
  .bar-caption{font-size:11px;margin-top:5px;}

  .editor{margin-top:12px;padding:12px;background:var(--surface2);border-radius:12px;display:flex;flex-direction:column;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .input{background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px 11px;font-size:15px;outline:none;width:100%;}
  .editor-actions{display:flex;gap:8px;margin-top:2px;}
  .increased-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(63,193,131,.12);color:var(--fresh);border:1px solid rgba(63,193,131,.33);border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .remove-ex-btn{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--stale);border:1px solid rgba(238,82,71,.27);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;}

  .card-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 14px;}
  .add-ex-btn{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--sub);border:1px dashed var(--border);border-radius:10px;padding:9px 12px;font-size:13.5px;cursor:pointer;}
  .del-workout-btn{background:none;border:none;color:var(--faint);padding:8px;cursor:pointer;border-radius:8px;}
  .confirm{display:flex;align-items:center;gap:8px;}
  .confirm .txt{font-size:12.5px;color:var(--sub);}
  .confirm .yes{background:var(--stale);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .confirm .no{background:none;color:var(--sub);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;}

  .add-workout{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:none;color:var(--text);border:1.5px dashed var(--border);border-radius:14px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;}
  .footnote{text-align:center;color:var(--faint);font-size:11.5px;margin-top:2px;}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.63);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:14px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;width:100%;max-width:460px;margin-bottom:env(safe-area-inset-bottom);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-family:var(--cond);font-weight:700;font-size:22px;margin:0;}
  .modal-sub{color:var(--sub);font-size:13px;margin:4px 0 16px;line-height:1.5;}
  .modal-done{width:100%;margin-top:18px;background:var(--accent);color:#1a0d06;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .gap{height:10px;}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){ .bar{transition:none;} }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">OVER<span>LOAD</span></div>
    <div class="byline">by <b>ORBITL</b></div>
    <div class="tagline">Track your lifts. Never stall.</div>
  </div>
  <button class="icon-btn" data-act="openSettings" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8597A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div class="legend" id="legend"></div>
<main id="app"></main>
<div id="modal-root"></div>

<script>
/* ---------- icons (inline svg) ---------- */
const I = {
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  undo:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  cal:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  plus15:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  minus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trend:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8597A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
};

/* ---------- helpers ---------- */
const STORAGE_KEY = "workout-tracker:v1";
const uid = () => Math.random().toString(36).slice(2,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function todayISO(){const d=new Date();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day;}
function daysSince(iso){if(!iso)return null;const a=new Date(iso+'T00:00:00');const b=new Date(todayISO()+'T00:00:00');return Math.round((b-a)/86400000);}
function relative(iso){const d=daysSince(iso);if(d===null)return'never';if(d<=0)return'today';if(d===1)return'yesterday';if(d<14)return d+' days ago';if(d<60)return Math.round(d/7)+' weeks ago';return Math.round(d/30)+' months ago';}
function parseWeight(s){if(!s)return null;const m=String(s).match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;}
function splitWeight(s){if(!s)return{num:null,suffix:'lbs'};const m=String(s).match(/(-?\d+(?:\.\d+)?)\s*(.*)/);if(!m)return{num:null,suffix:String(s).trim()||'lbs'};return{num:parseFloat(m[1]),suffix:(m[2]||'').trim()||'lbs'};}
function fmtNum(n){const r=Math.round(n*2)/2;return String(r);}
function makeWeight(num,suffix){return suffix?fmtNum(num)+' '+suffix:fmtNum(num);}
function statusFor(iso,th){const d=daysSince(iso);if(d===null)return{zone:'none',days:null,color:'var(--faint)',label:'Not set'};if(d<th.warnDays)return{zone:'fresh',days:d,color:'var(--fresh)',label:'Progressing'};if(d<th.staleDays)return{zone:'warm',days:d,color:'var(--warm)',label:'Getting stale'};return{zone:'stale',days:d,color:'var(--stale)',label:'Add weight'};}

/* ---------- seed ---------- */
function seed(){
  const mk=(name,scheme,weight,date,note='')=>({id:uid(),name,scheme,weight,note,lastIncreased:date});
  return {
    thresholds:{warnDays:14,staleDays:28},
    workouts:[
      {id:uid(),name:'Push',lastCompleted:'2026-06-12',prevCompleted:null,exercises:[
        mk('Bench Press','3x5','140 lbs','2026-06-12'),
        mk('Shoulder Press','3x8','100 lbs','2026-06-12'),
        mk('Tricep Dip','3x8','70 lbs','2026-06-12','Work backwards'),
        mk('Lateral Raise','3x8','10 lbs','2026-06-12','Dumbbell'),
        mk('Dumbbell Extension','3x8','35 lbs','2026-06-12','Dumbbell'),
        mk('Tricep Pushdown','3x8','55 lbs','2026-06-12','Next to the rowing machine'),
        mk('Pec Fly','3x8','150 lbs','2026-06-12'),
      ]},
      {id:uid(),name:'Pull',lastCompleted:'2026-06-15',prevCompleted:null,exercises:[
        mk('Lat Pull Down','5x5','150 lbs','2026-06-15'),
        mk('Row Machine','3x8','150 lbs','2026-06-15'),
        mk('Bent-Over Barbell Row','3x5','130 lbs','2026-06-15'),
        mk('Assisted Pull-Up','3x8','95 lbs','2026-06-15'),
        mk('Dumbbell Shrug','3x8','35 lbs','2026-06-15'),
        mk('Preacher Curl','3x8','10 lbs','2026-06-15'),
        mk('Hammer Curl','3x8','30 lbs','2026-06-15'),
      ]},
      {id:uid(),name:'Legs',lastCompleted:'2026-06-16',prevCompleted:null,exercises:[
        mk('Barbell Squat','5x5','115 lbs','2026-06-16'),
        mk('Hip Adductor','3x8','160 lbs','2026-06-16'),
        mk('Leg Press','3x8','235 lbs','2026-06-16'),
        mk('Seated Leg Curl','3x8','127.5 lbs','2026-06-16'),
        mk('Leg Extension','3x8','157.5 lbs','2026-06-16'),
        mk('Calf Extension','3x8','167.5 lbs','2026-06-16'),
      ]},
    ],
  };
}

/* ---------- state ---------- */
let state, ui = {openEx:null,dateW:null,editName:null,editWeight:null,confirmW:null,settings:false,flash:null};

function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function commit(){save();render();}

function findW(id){return state.workouts.find(w=>w.id===id);}
function findE(w,id){return w.exercises.find(e=>e.id===id);}

/* ---------- render ---------- */
function upNextId(){let best=null,bd=-Infinity;for(const w of state.workouts){const d=daysSince(w.lastCompleted);const v=d===null?99999:d;if(v>bd){bd=v;best=w.id;}}return best;}

function renderLegend(){
  const th=state.thresholds;
  document.getElementById('legend').innerHTML=[
    {c:'var(--fresh)',t:'Fresh · under '+th.warnDays+'d'},
    {c:'var(--warm)',t:'Aging · '+th.warnDays+'–'+th.staleDays+'d'},
    {c:'var(--stale)',t:'Overdue · '+th.staleDays+'d+'},
  ].map(i=>`<div class="item"><span class="dot" style="background:${i.c}"></span><span class="t">${i.t}</span></div>`).join('');
}

function exerciseHTML(w,ex){
  const th=state.thresholds, st=statusFor(ex.lastIncreased,th);
  const fill=st.days===null?0:Math.min(st.days/Math.max(th.staleDays,1),1);
  const {num,suffix}=splitWeight(ex.weight);
  const isFlash=ui.flash===ex.id;
  const open=ui.openEx===ex.id;
  const editingW=ui.editWeight===ex.id;

  const valueCell = editingW
    ? `<input class="step-input" data-act="weightInput" data-w="${w.id}" data-e="${ex.id}" value="${esc(ex.weight)}" placeholder="e.g. 140 lbs" />`
    : `<button class="step-value" data-act="editWeight" data-w="${w.id}" data-e="${ex.id}" aria-label="Type exact weight">
         <span class="step-num" style="${isFlash?'color:var(--fresh)':''}">${num===null?'—':fmtNum(num)}</span>
         <span class="step-unit">${num===null?'tap to set':esc(suffix)}</span>
       </button>`;

  const caption = st.days===null
    ? `<span style="color:var(--faint)">No increase logged · use + to add weight</span>`
    : `<span style="color:${st.color}">${isFlash?'Weight increased — nice.':esc(st.label)+' · last increase '+relative(ex.lastIncreased)}</span>`;

  const editor = open ? `
    <div class="editor">
      <label class="field"><span class="field-label">Exercise</span>
        <input class="input" data-act="exName" data-w="${w.id}" data-e="${ex.id}" value="${esc(ex.name)}" /></label>
      <label class="field"><span class="field-label">Sets × reps</span>
        <input class="input" data-act="exScheme" data-w="${w.id}" data-e="${ex.id}" value="${esc(ex.scheme)}" /></label>
      <label class="field"><span class="field-label">Note (optional)</span>
        <input class="input" data-act="exNote" data-w="${w.id}" data-e="${ex.id}" value="${esc(ex.note)}" placeholder="machine location, cues…" /></label>
      <label class="field"><span class="field-label">Last weight increase</span>
        <input class="input" type="date" max="${todayISO()}" data-act="exDate" data-w="${w.id}" data-e="${ex.id}" value="${esc(ex.lastIncreased||'')}" /></label>
      <div class="editor-actions">
        <button class="increased-btn" data-act="increased" data-w="${w.id}" data-e="${ex.id}">${I.trend} Increased today</button>
        <button class="remove-ex-btn" data-act="removeEx" data-w="${w.id}" data-e="${ex.id}">${I.trash} Remove</button>
      </div>
    </div>` : '';

  return `
  <div class="ex-row">
    <div class="ex-head">
      <button class="ex-name-btn" data-act="toggleEx" data-w="${w.id}" data-e="${ex.id}">
        <div class="ex-name">${esc(ex.name||'Untitled')}</div>
        <div class="ex-meta"><span>${esc(ex.scheme)}</span>${ex.note?`<span class="note"> · ${esc(ex.note)}</span>`:''}</div>
      </button>
      <div class="stepper">
        <button class="step-btn" data-act="step" data-delta="-2.5" data-w="${w.id}" data-e="${ex.id}" aria-label="Decrease 2.5 pounds">${I.minus}</button>
        ${valueCell}
        <button class="step-btn accent" data-act="step" data-delta="2.5" data-w="${w.id}" data-e="${ex.id}" aria-label="Increase 2.5 pounds">${I.plus}</button>
      </div>
      <button class="expand-btn" data-act="toggleEx" data-w="${w.id}" data-e="${ex.id}" aria-label="Edit exercise" style="transform:${open?'rotate(180deg)':'none'};transition:transform .18s">${I.chev}</button>
    </div>
    <div class="bar-track"><div class="bar" style="width:${fill*100}%;background:${st.color};${isFlash?'box-shadow:0 0 10px var(--fresh)':''}"></div></div>
    <div class="bar-caption">${caption}</div>
    ${editor}
  </div>`;
}

function cardHTML(w){
  const th=state.thresholds;
  const overdue=w.exercises.filter(e=>statusFor(e.lastIncreased,th).zone==='stale').length;
  const isUp=w.id===upNextId();
  const doneToday=w.lastCompleted===todayISO();
  const titleArea = ui.editName===w.id
    ? `<input class="name-input" data-act="nameInput" data-w="${w.id}" value="${esc(w.name)}" autofocus />`
    : `<h2 class="card-title" data-act="editName" data-w="${w.id}">${esc(w.name)}${isUp?'<span class="up-next">up next</span>':''}</h2>`;

  const dateRow = ui.dateW===w.id ? `
    <div class="date-row">
      <input class="date-input" type="date" max="${todayISO()}" data-act="setDate" data-w="${w.id}" value="${esc(w.lastCompleted||'')}" />
      ${w.lastCompleted?`<button class="clear-btn" data-act="clearDate" data-w="${w.id}">Clear</button>`:''}
    </div>` : '';

  const doneBtn = doneToday
    ? `<button class="undo-btn" data-act="undo" data-w="${w.id}">${I.undo} Undo</button>`
    : `<button class="done-btn" data-act="done" data-w="${w.id}">${I.check} Done today</button>`;

  const footerRight = ui.confirmW===w.id
    ? `<span class="confirm"><span class="txt">Delete ${esc(w.name)}?</span><button class="yes" data-act="delYes" data-w="${w.id}">Delete</button><button class="no" data-act="delNo" data-w="${w.id}">Keep</button></span>`
    : `<button class="del-workout-btn" data-act="delShow" data-w="${w.id}" aria-label="Delete workout">${I.trash}</button>`;

  return `
  <section class="card">
    <div class="card-top">
      <div style="flex:1;min-width:0">
        ${titleArea}
        <button class="last-done" data-act="toggleDate" data-w="${w.id}">${I.cal} Last done ${relative(w.lastCompleted)} ${I.chev}</button>
        ${dateRow}
      </div>
      <div style="flex-shrink:0">${doneBtn}</div>
    </div>
    ${overdue>0?`<div class="overdue">${I.trend} ${overdue} ${overdue===1?'lift is':'lifts are'} due for more weight</div>`:''}
    <div class="ex-list">${w.exercises.map(e=>exerciseHTML(w,e)).join('')}</div>
    <div class="card-footer">
      <button class="add-ex-btn" data-act="addEx" data-w="${w.id}">${I.plus15} Add exercise</button>
      ${footerRight}
    </div>
  </section>`;
}

function modalHTML(){
  if(!ui.settings) return '';
  const th=state.thresholds;
  return `
  <div class="scrim" data-scrim>
    <div class="modal" data-stop>
      <div class="modal-head"><h3 class="modal-title">Color thresholds</h3>
        <button class="icon-btn" data-act="closeSettings" aria-label="Close">${I.x}</button></div>
      <p class="modal-sub">How many days since your last weight increase before a lift turns gold, then red.</p>
      <label class="field"><span class="field-label">Turns gold after (days)</span>
        <input class="input" type="number" min="1" data-act="warnDays" value="${th.warnDays}" /></label>
      <div class="gap"></div>
      <label class="field"><span class="field-label">Turns red after (days)</span>
        <input class="input" type="number" min="1" data-act="staleDays" value="${th.staleDays}" /></label>
      <button class="modal-done" data-act="closeSettings">Done</button>
    </div>
  </div>`;
}

function render(){
  renderLegend();
  document.getElementById('app').innerHTML =
    state.workouts.map(cardHTML).join('') +
    `<button class="add-workout" data-act="addWorkout">${I.plus15} Add workout</button>` +
    `<p class="footnote">Saved automatically on this device.</p>`;
  document.getElementById('modal-root').innerHTML = modalHTML();
  // autofocus any freshly-shown text input
  const af = document.querySelector('input[autofocus], .step-input, .name-input');
  if(ui.editName||ui.editWeight){ const el = document.querySelector('.name-input, .step-input'); if(el){el.focus(); el.select && el.select();} }
}

/* ---------- weight step ---------- */
function step(w,ex,delta){
  const {num,suffix}=splitWeight(ex.weight);
  const base=num===null?0:num;
  let next=Math.round((base+delta)*2)/2; if(next<0)next=0;
  ex.weight=makeWeight(next,suffix);
  if(next>base){ ex.lastIncreased=todayISO(); flash(ex.id); }
  commit();
}
function commitWeight(ex,val){
  const oldN=parseWeight(ex.weight), newN=parseWeight(val);
  ex.weight=val;
  if(oldN!==null && newN!==null && newN>oldN){ ex.lastIncreased=todayISO(); flash(ex.id); }
}
function flash(id){ui.flash=id; setTimeout(()=>{if(ui.flash===id){ui.flash=null;render();}},1600);}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  // modal handling first (works even when tapping the X's inner svg)
  if(ui.settings){
    if(e.target.closest('[data-act="closeSettings"]')){ ui.settings=false; render(); return; }
    if(e.target.closest('[data-stop]')) return;            // tap inside modal: ignore
    if(e.target.closest('[data-scrim]')){ ui.settings=false; render(); return; } // backdrop
  }
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act, wId=t.dataset.w, eId=t.dataset.e;
  const w=wId?findW(wId):null; const ex=(w&&eId)?findE(w,eId):null;

  switch(act){
    case 'openSettings': ui.settings=true; render(); break;
    case 'done': w.prevCompleted=w.lastCompleted??null; w.lastCompleted=todayISO(); ui.dateW=null; commit(); break;
    case 'undo': w.lastCompleted=w.prevCompleted??null; commit(); break;
    case 'toggleDate': ui.dateW=ui.dateW===wId?null:wId; render(); break;
    case 'clearDate': w.lastCompleted=null; commit(); break;
    case 'editName': ui.editName=wId; render(); break;
    case 'delShow': ui.confirmW=wId; render(); break;
    case 'delNo': ui.confirmW=null; render(); break;
    case 'delYes': state.workouts=state.workouts.filter(x=>x.id!==wId); ui.confirmW=null; commit(); break;
    case 'addEx': w.exercises.push({id:uid(),name:'New exercise',scheme:'3x8',weight:'',note:'',lastIncreased:null}); commit(); break;
    case 'addWorkout': state.workouts.push({id:uid(),name:'New workout',lastCompleted:null,prevCompleted:null,exercises:[]}); commit(); break;
    case 'toggleEx': ui.openEx=ui.openEx===eId?null:eId; render(); break;
    case 'step': step(w,ex,parseFloat(t.dataset.delta)); break;
    case 'editWeight': ui.editWeight=eId; render(); break;
    case 'increased': ex.lastIncreased=todayISO(); commit(); break;
    case 'removeEx': w.exercises=w.exercises.filter(x=>x.id!==eId); if(ui.openEx===eId)ui.openEx=null; commit(); break;
  }
});

// silent state updates for text fields (no re-render → keeps focus)
document.addEventListener('input', e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const w=t.dataset.w?findW(t.dataset.w):null; const ex=(w&&t.dataset.e)?findE(w,t.dataset.e):null;
  switch(t.dataset.act){
    case 'nameInput': w.name=t.value; break;
    case 'exName': ex.name=t.value; break;
    case 'exScheme': ex.scheme=t.value; break;
    case 'exNote': ex.note=t.value; break;
  }
});

// commit on change / blur
document.addEventListener('change', e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const w=t.dataset.w?findW(t.dataset.w):null; const ex=(w&&t.dataset.e)?findE(w,t.dataset.e):null;
  switch(t.dataset.act){
    case 'setDate': w.lastCompleted=t.value||null; save(); break;
    case 'exDate': ex.lastIncreased=t.value||null; commit(); break;
    case 'warnDays': state.thresholds.warnDays=Math.max(1,parseInt(t.value||'1',10)); commit(); break;
    case 'staleDays': state.thresholds.staleDays=Math.max(1,parseInt(t.value||'1',10)); commit(); break;
  }
});

document.addEventListener('blur', e=>{
  const t=e.target.closest && e.target.closest('[data-act]'); if(!t)return;
  const w=t.dataset.w?findW(t.dataset.w):null; const ex=(w&&t.dataset.e)?findE(w,t.dataset.e):null;
  switch(t.dataset.act){
    case 'nameInput': ui.editName=null; commit(); break;
    case 'weightInput': commitWeight(ex,t.value); ui.editWeight=null; commit(); break;
  }
}, true);

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter')return;
  const t=e.target.closest && e.target.closest('[data-act]'); if(!t)return;
  if(t.dataset.act==='nameInput'||t.dataset.act==='weightInput'){ e.target.blur(); }
});

/* ---------- boot ---------- */
state = load();
render();
</script>
</body>
</html>
